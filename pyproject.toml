[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrosheaf"
version = "0.5.0"
description = "Hydrogeochemical analysis and flow network fitting"
authors = [
  { name="Hydrosheaf Team", email="info@hydrosheaf.org" },
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "networkx",
    "matplotlib",
    "pydantic",
    "typer",
    "flopy",
    "seaborn",
    "phreeqpy",
    "pyvista",
    "vtk",
    "pymc",
    "nutpie",
    "PyYAML",
]

[project.optional-dependencies]
dev = ["pytest", "black", "mypy"]

[tool.setuptools.packages.find]
include = ["hydrosheaf*"]

[project.scripts]
hydrosheaf = "hydrosheaf.cli:main"
hydrosheaf-cal = "hydrosheaf.calibration.cli:run_calibration_cli"
